name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # tests/ 用 jsdom + jszip，都是纯 JS，无需浏览器
      - name: 安装测试依赖
        run: npm install jsdom jszip --no-save --no-audit --no-fund

      # test-perf.mjs 与 test-epub-toc.mjs 依赖这个体积样本，先生成
      - name: 生成压力测试用的 EPUB
        run: node tests/make-big-epub.mjs

      - name: 跑全部测试
        run: npm test

      - name: 跑性能测试
        run: node tests/test-perf.mjs
